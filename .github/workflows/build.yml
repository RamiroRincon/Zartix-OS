name: Build and Publish Artix OS

on:
  schedule:
    - cron: '0 2 * * 0' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the OS Image
        run: podman build -t ghcr.io/ramirorincon/zartix-os:latest .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish the OS Image
        run: podman push ghcr.io/ramirorincon/zartix-os:latest
