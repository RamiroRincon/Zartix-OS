name: Build and Publish Zartix-OS

on:
  schedule:
    # This makes GitHub build a fresh OS with new updates every Sunday at 2 AM
    - cron: '0 2 * * 0' 
  workflow_dispatch: # Allows you to click a button to build it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the OS Image
        # This compiles your Containerfile into a system image
        run: podman build -t ghcr.io/${{ github.repository_owner }}/my-artix-os:latest .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish the OS Image
        # This uploads the finished OS so your computer can download it
        run: podman push ghcr.io/${{ github.repository_owner }}/my-artix-os:latest
